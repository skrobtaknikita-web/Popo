name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Найти проект (папка или zip в корне репозитория)
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _unpacked; done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          [ -n "$F" ] || { echo "settings.gradle.kts не найден"; exit 1; }
          echo "PROJECT=$(dirname "$F")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Сборка
        run: cd "$PROJECT" && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HeartopiaAutoDraw-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Опубликовать APK в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" HeartopiaAutoDraw.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest HeartopiaAutoDraw.apk --title "Heartopia AutoDraw (последняя сборка)" --notes "Скачай HeartopiaAutoDraw.apk и установи."
